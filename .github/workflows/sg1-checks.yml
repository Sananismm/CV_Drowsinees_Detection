name: SG-1 checks

on:
  pull_request:
    paths:
      - "module_1/**"
      - "interfaces/**"
      - ".github/workflows/sg1-checks.yml"
  push:
    paths:
      - "module_1/**"
      - "interfaces/**"
      - ".github/workflows/sg1-checks.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: module_1/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r module_1/requirements-dev.txt
      - name: Compile Python files
        run: python -m compileall -q module_1/scripts module_1/tests
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run SG-1 tests
        run: python -m unittest discover -s module_1/tests -v
